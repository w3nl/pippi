# Talk to Claude anywhere: write "@claude …" in an issue, a pull request or a review comment.
# Use it to discuss a refined idea, or to ask for fixes on an agent's pull request.
name: "Agent: @claude"

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: >-
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association))
      )
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies and the test browser
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          claude_args: |
            --max-turns 100
            --allowedTools "Read,Glob,Grep,Edit,Write,MultiEdit,Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(git:*),Bash(gh issue:*),Bash(gh pr:*),Bash(gh workflow run:*),Bash(ls:*),Bash(cat:*),Bash(grep:*)"
            --append-system-prompt "This is the Villa Villekulla game repository (a Pippi Longstocking escape room); follow AGENTS.md. In an idea issue, help refine the plan (don't change code there). On a pull request, make the requested changes, run npm test until it passes, bump CACHE in sw.js when game files change, and push to the pull request's branch. After pushing to a pull request, start the checks again with: gh workflow run tests.yml --ref <branch>; gh workflow run agent-review.yml -f pr_number=<n>; gh workflow run agent-playtest.yml -f pr_number=<n>."
