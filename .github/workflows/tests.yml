name: Play the game

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  play:
    name: Play all chapters
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install the browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Play the game
        run: npx playwright test
        env:
          PW_FIREFOX: '1'

      - name: Check the phone layouts in Dutch
        run: npx playwright test tests/phone.spec.js --reporter=list   # list only, so the HTML report of the full run is kept
        env:
          PW_LANG: nl

      - name: Check the phone layouts in Swedish
        run: npx playwright test tests/phone.spec.js --reporter=list
        env:
          PW_LANG: sv

      - name: Upload the test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
