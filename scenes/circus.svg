<svg xmlns="http://www.w3.org/2000/svg" class="scene" id="sc-circus" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-label="Inside the big top">
  <defs>
    <linearGradient id="ccSaw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9a861"/><stop offset="1" stop-color="#a8743d"/></linearGradient>
    <linearGradient id="ccVelvet" x1="0" x2="1"><stop offset="0" stop-color="#7a1414"/><stop offset=".5" stop-color="#b52222"/><stop offset="1" stop-color="#7a1414"/></linearGradient>
    <radialGradient id="ccBack" cx=".5" cy=".6" r=".6"><stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#b5651d"/></radialGradient>
    <linearGradient id="ccGold" x1="0" x2="1"><stop offset="0" stop-color="#c9952a"/><stop offset=".5" stop-color="#f3d27a"/><stop offset="1" stop-color="#b07f1f"/></linearGradient>
    <radialGradient id="ccVign" cx=".5" cy=".5" r=".75"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".65"/></radialGradient>
    <linearGradient id="ccBeamW" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff8e0" stop-opacity=".55"/><stop offset="1" stop-color="#fff8e0" stop-opacity="0"/></linearGradient>
    <linearGradient id="ccBeamR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff4a4a" stop-opacity=".5"/><stop offset="1" stop-color="#ff4a4a" stop-opacity="0"/></linearGradient>
    <linearGradient id="ccBeamG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4aff6a" stop-opacity=".45"/><stop offset="1" stop-color="#4aff6a" stop-opacity="0"/></linearGradient>
    <linearGradient id="ccBeamB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a7aff" stop-opacity=".5"/><stop offset="1" stop-color="#4a7aff" stop-opacity="0"/></linearGradient>
    <clipPath id="ccStageClip"><rect x="600" y="250" width="400" height="320"/></clipPath>
  </defs>

  <!-- the tent: red and cream stripes rising to the top of the pole -->
  <rect width="1600" height="900" fill="#3a0f0f"/>
  <g id="cc-stripes"></g>
  <path d="M0 520 Q800 470 1600 520 V900 H0z" fill="#2a1408"/>
  <!-- bunting: drawn by buildCircus() -->
  <g id="cc-bunting"></g>
  <!-- flags on top of the tent poles -->
  <g fill="#f2c94c"><path class="flagw" d="M262 40 l40 10 l-40 10z"/><path class="flagw b" d="M1338 40 l40 10 l-40 10z"/></g>
  <g fill="#8a6a3a"><rect x="256" y="36" width="6" height="500"/><rect x="1332" y="36" width="6" height="500"/></g>

  <!-- the spotlights, high up, with their beams -->
  <g id="cc-lamps">
    <g class="beam a"><polygon id="cc-beam0" points="380,60 300,620 520,620" fill="url(#ccBeamR)"/></g>
    <g class="beam b"><polygon id="cc-beam1" points="800,50 690,640 910,640" fill="url(#ccBeamG)"/></g>
    <g class="beam c"><polygon id="cc-beam2" points="1220,60 1080,620 1300,620" fill="url(#ccBeamB)"/></g>
    <g fill="#2a2a2a"><rect x="364" y="40" width="32" height="26" rx="5"/><rect x="784" y="30" width="32" height="26" rx="5"/><rect x="1204" y="40" width="32" height="26" rx="5"/></g>
    <g id="cc-lampglow"><circle cx="380" cy="64" r="9" fill="#ff6a6a"/><circle cx="800" cy="54" r="9" fill="#6aff8a"/><circle cx="1220" cy="64" r="9" fill="#6a9aff"/></g>
  </g>

  <!-- the trapezes, swinging: out of time until the trapeze puzzle is solved -->
  <g id="cc-trapezes">
    <g class="swing l"><path d="M520 0 V180 M580 0 V180" stroke="#d9c79a" stroke-width="3"/><rect x="512" y="178" width="76" height="7" rx="3" fill="#8a5a2b"/>
      <g><circle cx="550" cy="205" r="11" fill="#f3c9a4"/><path d="M538 184 l6 14 M562 184 l-6 14" stroke="#f3c9a4" stroke-width="5" stroke-linecap="round"/><path d="M540 214 h20 l4 40 h-28z" fill="#e8571f"/><path d="M542 254 l-4 24 M558 254 l4 24" stroke="#f3c9a4" stroke-width="5" stroke-linecap="round"/></g></g>
    <g class="swing r"><path d="M1020 0 V200 M1080 0 V200" stroke="#d9c79a" stroke-width="3"/><rect x="1012" y="198" width="76" height="7" rx="3" fill="#8a5a2b"/>
      <g><circle cx="1050" cy="225" r="11" fill="#e2b38c"/><path d="M1038 204 l6 14 M1062 204 l-6 14" stroke="#e2b38c" stroke-width="5" stroke-linecap="round"/><path d="M1040 234 h20 l4 40 h-28z" fill="#2f5f9a"/><path d="M1042 274 l-4 24 M1058 274 l4 24" stroke="#e2b38c" stroke-width="5" stroke-linecap="round"/></g></g>
  </g>

  <!-- the sign over the curtain, with chasing light bulbs -->
  <g id="cc-sign">
    <rect x="610" y="170" width="380" height="74" rx="14" fill="#1f2a5c" stroke="url(#ccGold)" stroke-width="6"/>
    <text x="800" y="222" text-anchor="middle" font-family="Fredoka, sans-serif" font-size="40" font-weight="700" fill="#f2c94c" letter-spacing="4">CIRCUS</text>
    <g id="cc-bulbs"></g>
  </g>

  <!-- the performers' curtain: closed until the very end -->
  <g id="cc-stage">
    <rect x="600" y="250" width="400" height="320" fill="url(#ccBack)"/>
    <g clip-path="url(#ccStageClip)">
      <g id="cc-curl"><rect x="600" y="250" width="202" height="320" fill="url(#ccVelvet)"/><path d="M620 250 v320 M660 250 v320 M700 250 v320 M740 250 v320 M780 250 v320" stroke="#5a0c0c" stroke-width="3" opacity=".6"/><path d="M600 560 h202" stroke="url(#ccGold)" stroke-width="10"/></g>
      <g id="cc-curr"><rect x="798" y="250" width="202" height="320" fill="url(#ccVelvet)"/><path d="M820 250 v320 M860 250 v320 M900 250 v320 M940 250 v320 M980 250 v320" stroke="#5a0c0c" stroke-width="3" opacity=".6"/><path d="M798 560 h202" stroke="url(#ccGold)" stroke-width="10"/></g>
    </g>
    <rect x="590" y="244" width="420" height="18" rx="6" fill="url(#ccGold)"/>
    <!-- the curtain winch, with its crank -->
    <g id="cc-winch"><rect x="1012" y="470" width="58" height="70" rx="6" fill="#4a3a2a" stroke="#2a1a0c" stroke-width="3"/><circle cx="1041" cy="505" r="18" fill="none" stroke="#c9952a" stroke-width="6" stroke-dasharray="6 4"/><path d="M1041 505 l20 -16" stroke="#9aa0a6" stroke-width="5" stroke-linecap="round"/><circle cx="1061" cy="489" r="5" fill="#c4302b"/></g>
  </g>

  <!-- the ring: sawdust and a red-and-white curb -->
  <ellipse cx="800" cy="740" rx="560" ry="150" fill="url(#ccSaw)"/>
  <ellipse cx="800" cy="740" rx="560" ry="150" fill="none" stroke="#c4302b" stroke-width="22"/>
  <ellipse cx="800" cy="740" rx="560" ry="150" fill="none" stroke="#fffaf0" stroke-width="22" stroke-dasharray="40 40"/>

  <!-- the seal on its stool, balancing a ball -->
  <g id="cc-seal">
    <rect x="300" y="610" width="70" height="40" rx="6" fill="#2f5f9a" stroke="#f2c94c" stroke-width="4"/>
    <g id="cc-sealbody"><path d="M312 612 q-6 -50 20 -66 q30 -12 34 20 q2 30 -10 46z" fill="#4a4f5a"/>
    <circle cx="344" cy="552" r="3" fill="#111"/><path d="M356 562 h10" stroke="#111" stroke-width="2"/>
    <circle class="sealball" cx="352" cy="526" r="14" fill="#e8571f" stroke="#fffaf0" stroke-width="3"/></g>
  </g>

  <!-- the clown, by the curtain: three balls on the floor, or juggling once you've fixed his pattern -->
  <g id="cc-clown">
    <path d="M470 620 l20 -110 h50 l20 110z" fill="#f2c94c"/>
    <g fill="#c4302b"><circle cx="505" cy="540" r="6"/><circle cx="525" cy="570" r="6"/><circle cx="510" cy="600" r="6"/></g>
    <path d="M478 620 l-8 20 h30 z M542 620 l-8 20 h30 z" fill="#c4302b"/>
    <circle cx="515" cy="488" r="26" fill="#fffaf0"/>
    <path d="M489 480 q-14 -20 4 -26 q-4 14 8 12z M541 480 q14 -20 -4 -26 q4 14 -8 12z" fill="#e8571f"/>
    <path d="M500 460 l15 -30 l15 30z" fill="#1f4d8c"/><circle cx="515" cy="428" r="5" fill="#f2c94c"/>
    <circle cx="507" cy="484" r="3" fill="#111"/><circle cx="523" cy="484" r="3" fill="#111"/>
    <circle id="cc-nose" cx="515" cy="494" r="7" fill="#e2483d"/>
    <path id="cc-frown" d="M505 506 q10 -8 20 0" stroke="#c4302b" stroke-width="3" fill="none"/>
    <path id="cc-smile" d="M503 502 q12 12 24 0" stroke="#c4302b" stroke-width="3" fill="none" style="display:none"/>
    <path d="M490 520 l-20 -20 M540 520 l20 -20" stroke="#f2c94c" stroke-width="10" stroke-linecap="round"/>
    <g id="cc-balls-floor"><circle cx="470" cy="634" r="9" fill="#e2483d"/><circle cx="560" cy="636" r="9" fill="#2f5f9a"/><circle cx="582" cy="630" r="9" fill="#2f5f9a"/></g>
    <g id="cc-balls-air" style="display:none"><circle class="jball a" cx="515" cy="440" r="9" fill="#e2483d"/><circle class="jball b" cx="515" cy="440" r="9" fill="#2f5f9a"/><circle class="jball c" cx="515" cy="440" r="9" fill="#2f5f9a"/></g>
  </g>

  <!-- the ringmaster, in his top hat -->
  <g id="cc-ringmaster">
    <path d="M1100 640 l8 -100 h44 l8 100z" fill="#1a1a1a"/>
    <path d="M1096 540 h68 l-8 -70 h-52z" fill="#c4302b"/>
    <path d="M1118 470 l12 30 l12 -30" fill="#fffaf0"/>
    <g fill="url(#ccGold)"><circle cx="1124" cy="510" r="3"/><circle cx="1124" cy="526" r="3"/><circle cx="1136" cy="510" r="3"/><circle cx="1136" cy="526" r="3"/></g>
    <circle cx="1130" cy="446" r="22" fill="#f0c8a0"/>
    <path d="M1112 452 q18 14 36 0" stroke="#4a2a1a" stroke-width="5" fill="none" stroke-linecap="round"/>
    <circle cx="1122" cy="442" r="2.6" fill="#111"/><circle cx="1138" cy="442" r="2.6" fill="#111"/>
    <rect x="1106" y="420" width="48" height="8" rx="2" fill="#1a1a1a"/><rect x="1114" y="384" width="32" height="38" rx="3" fill="#1a1a1a"/><rect x="1114" y="412" width="32" height="6" fill="#c4302b"/>
    <path class="cane" d="M1164 500 l30 90" stroke="#fffaf0" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- the teeterboard, in the ring, with the strongman on one end -->
  <g id="cc-teeter">
    <path d="M1180 760 l-26 40 h52z" fill="#8a5a2b"/>
    <g id="cc-board"><rect x="1000" y="752" width="360" height="12" rx="4" fill="#c98a4b" stroke="#7a4a1f" stroke-width="3"/>
      <!-- the strongman, on the left end -->
      <g id="cc-strongman"><rect x="1040" y="672" width="46" height="80" rx="16" fill="#1a1a1a"/><path d="M1040 690 h46" stroke="#fffaf0" stroke-width="8" stroke-dasharray="8 6"/><circle cx="1063" cy="654" r="20" fill="#e2b38c"/><path d="M1049 662 q14 10 28 0" stroke="#3a2a1a" stroke-width="5" fill="none"/><circle cx="1057" cy="648" r="2.4" fill="#111"/><circle cx="1069" cy="648" r="2.4" fill="#111"/>
        <path d="M1040 690 l-24 -20 M1086 690 l24 -20" stroke="#e2b38c" stroke-width="12" stroke-linecap="round"/></g>
      <rect x="1310" y="740" width="30" height="12" rx="3" fill="#f2c94c"/>
    </g>
  </g>

  <!-- the circus horse, in the same style as the horse in Chapter 3 (white with black spots, a sandy mane),
       trotting round and round the ring: diagonal pairs of legs move together, each knee folds as the leg swings forward.
       Pippi stands on its back at the end. -->
  <g id="cc-horsewrap" transform="translate(0 -14)"><g id="cc-horse">
    <g class="hbody">
      <!-- the far legs, a shade darker, behind the body -->
      <g class="hleg fore far b" style="transform-origin:828px 744px"><path d="M828 744 v27" stroke="#e2dccb" stroke-width="9" stroke-linecap="round"/><g class="shin" style="transform-origin:828px 771px"><path d="M828 771 v25" stroke="#e2dccb" stroke-width="7" stroke-linecap="round"/><rect x="823" y="794" width="10" height="6" rx="2" fill="#3a2a1a"/></g></g><g class="hleg hind far a" style="transform-origin:774px 744px"><path d="M774 744 v27" stroke="#e2dccb" stroke-width="9" stroke-linecap="round"/><g class="shin" style="transform-origin:774px 771px"><path d="M774 771 v25" stroke="#e2dccb" stroke-width="7" stroke-linecap="round"/><rect x="769" y="794" width="10" height="6" rx="2" fill="#3a2a1a"/></g></g>
      <!-- tail -->
      <path class="htail" d="M754 724 q-22 6 -18 40" stroke="#d9c79a" stroke-width="7" fill="none" stroke-linecap="round"/>
      <!-- body -->
      <ellipse cx="800" cy="730" rx="50" ry="22" fill="#f6f1e6"/>
      <!-- neck, up to the head -->
      <path d="M826 724 q8 -34 30 -52 l16 12 q-14 18 -16 46z" fill="#f6f1e6"/>
      <!-- mane along the top of the neck -->
      <path d="M826 716 q8 -30 28 -46" stroke="#d9c79a" stroke-width="6" fill="none" stroke-linecap="round"/>
      <!-- head: long, pointing forward and a little down -->
      <path d="M852 668 q14 -10 30 0 q14 10 12 22 q-2 8 -12 6 q-14 -4 -26 -12z" fill="#f6f1e6"/>
      <path d="M858 664 l-2 -12 l10 8z" fill="#f6f1e6"/>
      <circle cx="870" cy="674" r="2.4" fill="#1a1a1a"/>
      <circle cx="890" cy="690" r="1.8" fill="#8a7a6a"/>
      <!-- circus plume and saddle cloth -->
      <path d="M858 662 q-4 -24 8 -32 q2 14 -2 30" fill="#c4302b"/>
      <path d="M782 710 h40 l-4 26 h-32z" fill="#2f5f9a"/><path d="M782 710 h40" stroke="#f2c94c" stroke-width="3"/>
      <!-- spots -->
      <g fill="#1a1a1a"><circle cx="770" cy="722" r="6"/><circle cx="806" cy="742" r="5"/><circle cx="836" cy="736" r="4"/><circle cx="762" cy="740" r="3.5"/><circle cx="844" cy="700" r="3.5"/></g>
      <!-- the near legs, in front of the body -->
      <g class="hleg fore near a" style="transform-origin:822px 746px"><path d="M822 746 v27" stroke="#f6f1e6" stroke-width="9" stroke-linecap="round"/><g class="shin" style="transform-origin:822px 773px"><path d="M822 773 v25" stroke="#f6f1e6" stroke-width="7" stroke-linecap="round"/><rect x="817" y="796" width="10" height="6" rx="2" fill="#3a2a1a"/></g></g><g class="hleg hind near b" style="transform-origin:780px 746px"><path d="M780 746 v27" stroke="#f6f1e6" stroke-width="9" stroke-linecap="round"/><g class="shin" style="transform-origin:780px 773px"><path d="M780 773 v25" stroke="#f6f1e6" stroke-width="7" stroke-linecap="round"/><rect x="775" y="796" width="10" height="6" rx="2" fill="#3a2a1a"/></g></g>
      <!-- Pippi, standing on the horse's back, at the end -->
      <g id="cc-rider" style="display:none"><path d="M792 708 l4 -40 h16 l4 40z" fill="#3f8a4a"/><circle cx="804" cy="656" r="12" fill="#f3c9a4"/><path d="M792 652 l-16 -8 M816 652 l16 -8" stroke="#e8571f" stroke-width="6" stroke-linecap="round"/><path d="M794 676 l-20 -16 M814 676 l20 -16" stroke="#f3c9a4" stroke-width="5" stroke-linecap="round"/></g>
    </g>
  </g></g>

  <!-- the ticket booth, at the front -->
  <g id="cc-booth">
    <rect x="40" y="420" width="220" height="300" rx="6" fill="#c4302b" stroke="#7a1414" stroke-width="5"/>
    <path d="M30 420 l120 -60 l120 60z" fill="#f2c94c" stroke="#b07f1f" stroke-width="4"/>
    <rect x="70" y="460" width="160" height="90" rx="6" fill="#ffe08a" stroke="#7a1414" stroke-width="4"/>
    <text x="150" y="590" text-anchor="middle" font-family="Fredoka, sans-serif" font-size="22" font-weight="700" fill="#fffaf0">TICKETS</text>
    <text x="150" y="620" text-anchor="middle" font-family="Fredoka, sans-serif" font-size="16" fill="#ffe08a">3 crowns each</text>
    <rect x="56" y="548" width="188" height="14" rx="4" fill="#7a1414"/>
    <g id="cc-spunk"><rect x="186" y="512" width="30" height="34" rx="5" fill="#cfe6e0" opacity=".6" stroke="#e9f4f0" stroke-width="2"/><rect x="184" y="506" width="34" height="7" rx="3" fill="#e8571f"/><ellipse class="crawl" cx="201" cy="532" rx="6" ry="4" fill="#2f8a3a"/></g>
  </g>

  <!-- the ringmaster's checklist, on the tent pole -->
  <g id="cc-list">
    <rect x="210" y="250" width="100" height="130" rx="4" fill="#fffaf0" stroke="#7a4a1f" stroke-width="4" transform="rotate(-3 260 315)"/>
    <text x="258" y="276" text-anchor="middle" font-family="Fredoka, sans-serif" font-size="11" font-weight="700" fill="#c4302b" transform="rotate(-3 260 315)">BEFORE THE SHOW</text>
    <g id="cc-ticks" font-family="Caveat, cursive" font-size="16" fill="#1f2a44" transform="rotate(-3 260 315)"></g>
  </g>

  <!-- Pippi at the ringside, with Mr Nilsson on her shoulder -->
  <g id="cc-pippi">
    <path d="M1400 760 l10 -100 h50 l10 100z" fill="#3f8a4a"/>
    <path d="M1416 760 v60 M1452 760 v60" stroke="#f3c9a4" stroke-width="12"/>
    <path d="M1410 820 h16 M1446 820 h16" stroke="#1a1a1a" stroke-width="10" stroke-linecap="round"/>
    <path d="M1414 790 h8 M1450 790 h8" stroke="#6b4423" stroke-width="12"/>
    <circle cx="1435" cy="630" r="26" fill="#f3c9a4"/>
    <path d="M1409 624 q2 -26 26 -26 q24 0 26 26 q-10 -12 -26 -12 q-16 0 -26 12z" fill="#e8571f"/>
    <path d="M1411 628 l-28 -12 M1459 628 l28 -12" stroke="#e8571f" stroke-width="8" stroke-linecap="round"/>
    <circle cx="1427" cy="632" r="2.6" fill="#111"/><circle cx="1443" cy="632" r="2.6" fill="#111"/>
    <path d="M1426 644 q9 8 18 0" stroke="#9a3a2a" stroke-width="2.6" fill="none"/>
    <g class="bob"><circle cx="1472" cy="644" r="11" fill="#6b4423"/><ellipse cx="1472" cy="648" rx="7" ry="6" fill="#e6c49a"/><ellipse cx="1472" cy="634" rx="14" ry="3" fill="#e9d48a"/><path d="M1462 656 h20 v14 h-20z" fill="#2f5f9a"/></g>
  </g>

  <!-- confetti for the finale: drawn by buildCircus() -->
  <g id="cc-confetti" style="display:none"></g>

  <rect width="1600" height="900" fill="url(#ccVign)" pointer-events="none"/>

  <!-- hotspots -->
  <g>
    <rect class="hit" fill="transparent" data-hs="booth" data-label="Ticket booth" x="40" y="380" width="140" height="340"/>
    <rect class="hit" fill="transparent" data-hs="spunk5" data-label="Jam jar" x="180" y="500" width="44" height="50" id="hit-spunk5"/>
    <rect class="hit" fill="transparent" data-hs="list5" data-label="The ringmaster's checklist" x="204" y="244" width="112" height="144"/>
    <rect class="hit" fill="transparent" data-hs="lamps" data-label="Spotlights" x="340" y="20" width="920" height="60"/>
    <rect class="hit" fill="transparent" data-hs="trapeze" data-label="Trapezes" x="490" y="80" width="620" height="140"/>
    <rect class="hit" fill="transparent" data-hs="seal" data-label="The seal" x="296" y="500" width="80" height="150"/>
    <rect class="hit" fill="transparent" data-hs="clown" data-label="The clown" x="456" y="410" width="134" height="232"/>
    <rect class="hit" fill="transparent" data-hs="curtain" data-label="The performers' curtain" x="600" y="244" width="410" height="326"/>
    <rect class="hit" fill="transparent" data-hs="winch" data-label="Curtain winch" x="1010" y="466" width="62" height="78"/>
    <rect class="hit" fill="transparent" data-hs="ringmaster" data-label="The ringmaster" x="1090" y="380" width="110" height="262"/>
    <rect class="hit" fill="transparent" data-hs="teeter" data-label="Teeterboard" x="1000" y="640" width="370" height="160"/>
    <rect class="hit" fill="transparent" data-hs="pippi5" data-label="Pippi" x="1380" y="590" width="120" height="240"/>
  </g>
</svg>
