<svg xmlns="http://www.w3.org/2000/svg" class="scene" id="sc-classroom" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-label="The classroom">
  <defs>
    <linearGradient id="clWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9d9a8"/><stop offset="1" stop-color="#d8c287"/></linearGradient>
    <linearGradient id="clFloor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a86a3a"/><stop offset="1" stop-color="#5e3a1e"/></linearGradient>
    <linearGradient id="clBoard" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f4a3a"/><stop offset="1" stop-color="#253c2f"/></linearGradient>
    <linearGradient id="clSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc0f0"/><stop offset="1" stop-color="#cdeaff"/></linearGradient>
    <radialGradient id="clSun" cx=".3" cy=".1" r=".9"><stop offset="0" stop-color="#fff6d0" stop-opacity=".35"/><stop offset="1" stop-color="#fff6d0" stop-opacity="0"/></radialGradient>
    <radialGradient id="clVign" cx=".5" cy=".45" r=".75"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".45"/></radialGradient>
    <linearGradient id="clGlobe" x1="0" x2="1"><stop offset="0" stop-color="#2f7fc0"/><stop offset="1" stop-color="#1f5a8c"/></linearGradient>
  </defs>

  <!-- walls, wainscot, floor -->
  <rect width="1600" height="660" fill="url(#clWall)"/>
  <rect y="470" width="1600" height="190" fill="#7a9a6a"/>
  <rect y="466" width="1600" height="10" fill="#5e7a50"/>
  <rect width="1600" height="30" fill="#8a6a3a"/>
  <rect y="660" width="1600" height="240" fill="url(#clFloor)"/>
  <g stroke="rgba(0,0,0,.2)" stroke-width="3"><path d="M0 720H1600M0 790H1600M0 860H1600"/></g>

  <!-- the clock -->
  <g id="cl-clock"><circle cx="710" cy="72" r="30" fill="#fffaf0" stroke="#4a3a2a" stroke-width="5"/><path d="M710 72 v-18 M710 72 l14 6" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/></g>

  <!-- the 9-times-table poster -->
  <g id="cl-nine">
    <rect x="250" y="130" width="140" height="180" fill="#fffaf0" stroke="#c4302b" stroke-width="4"/>
    <text x="320" y="156" text-anchor="middle" font-family="Fredoka, sans-serif" font-size="15" font-weight="700" fill="#c4302b">9 ×</text>
    <g fill="#f3c9a4" stroke="#b5835a" stroke-width="1.5"><rect x="266" y="200" width="9" height="40" rx="4"/><rect x="278" y="194" width="9" height="46" rx="4"/><rect x="290" y="190" width="9" height="50" rx="4"/><rect x="302" y="194" width="9" height="46" rx="4"/><rect x="314" y="214" width="9" height="26" rx="4"/><rect x="330" y="214" width="9" height="26" rx="4"/><rect x="342" y="194" width="9" height="46" rx="4"/><rect x="354" y="190" width="9" height="50" rx="4"/><rect x="366" y="194" width="9" height="46" rx="4"/><rect x="378" y="200" width="9" height="40" rx="4"/></g>
    <text x="320" y="272" text-anchor="middle" font-family="Caveat, cursive" font-size="18" fill="#1f4d8c">9 × 4 = 36</text>
    <text x="320" y="296" text-anchor="middle" font-family="Caveat, cursive" font-size="14" fill="#1f4d8c">✋ trick!</text>
  </g>

  <!-- the blackboard -->
  <g id="cl-board">
    <rect x="430" y="110" width="560" height="280" rx="6" fill="#6b4423"/>
    <rect x="444" y="124" width="532" height="252" fill="url(#clBoard)"/>
    <g font-family="Caveat, cursive" fill="#f3efe3">
      <text x="710" y="170" text-anchor="middle" font-size="34" font-weight="700" id="cl-board-t1">LAST DAY!</text>
      <text x="710" y="210" text-anchor="middle" font-size="24" id="cl-board-t2">Escape the classroom</text>
      <text x="470" y="270" font-size="26" fill="#f2c94c">9 × 7 = ?</text>
      <text x="610" y="272" font-size="22" fill="#ffb3a6">= a LOT  —P.</text>
      <text x="470" y="320" font-size="22">1. Register · 2. Cake · 3. Nature · 4. Plan</text>
      <text x="470" y="356" font-size="20" fill="#9fdc6e">a b c d e f g …</text>
    </g>
    <rect x="460" y="378" width="500" height="10" fill="#4a2e16"/>
    <rect x="520" y="372" width="40" height="8" rx="2" fill="#fffaf0"/><rect x="580" y="373" width="30" height="7" rx="2" fill="#f2c94c"/>
  </g>

  <!-- the plan of the classroom -->
  <g id="cl-plan">
    <rect x="1030" y="130" width="190" height="150" fill="#fffaf0" stroke="#1f4d8c" stroke-width="4"/>
    <text x="1125" y="152" text-anchor="middle" font-family="Fredoka, sans-serif" font-size="12" font-weight="700" fill="#1f4d8c">OUR CLASSROOM</text>
    <g stroke="#9ab4d8" stroke-width="1.2"><path d="M1050 160 h150 M1050 190 h150 M1050 220 h150 M1050 250 h150 M1050 270 h150 M1050 160 v110 M1075 160 v110 M1100 160 v110 M1125 160 v110 M1150 160 v110 M1175 160 v110 M1200 160 v110"/></g>
    <g fill="#c4302b"><rect x="1080" y="166" width="40" height="8"/><rect x="1053" y="196" width="18" height="18"/><rect x="1180" y="226" width="16" height="16"/></g>
  </g>

  <!-- the nature cupboard, with the globe on top -->
  <g id="cl-cupboard">
    <rect x="40" y="250" width="170" height="410" rx="6" fill="#8a5a2b" stroke="#4e2a12" stroke-width="5"/>
    <rect x="54" y="266" width="66" height="210" rx="3" fill="#cfe6e0" opacity=".55" stroke="#4e2a12" stroke-width="3"/>
    <rect x="130" y="266" width="66" height="210" rx="3" fill="#cfe6e0" opacity=".55" stroke="#4e2a12" stroke-width="3"/>
    <g id="cl-jars"><rect x="62" y="300" width="22" height="30" rx="4" fill="#bfe0a0" opacity=".8"/><rect x="90" y="300" width="22" height="30" rx="4" fill="#bfe0a0" opacity=".8"/><rect x="138" y="300" width="22" height="30" rx="4" fill="#bfe0a0" opacity=".8"/><rect x="166" y="300" width="22" height="30" rx="4" fill="#bfe0a0" opacity=".8"/>
      <rect x="62" y="400" width="126" height="60" rx="4" fill="#9fd0e8" opacity=".6"/><ellipse id="cl-frog" cx="120" cy="446" rx="14" ry="9" fill="#3f8a4a"/><circle cx="112" cy="438" r="4" fill="#3f8a4a"/><circle cx="128" cy="438" r="4" fill="#3f8a4a"/></g>
    <rect x="54" y="490" width="142" height="156" rx="3" fill="#9c6a35" stroke="#4e2a12" stroke-width="3"/>
    <g id="cl-cuplock"><rect x="118" y="470" width="16" height="16" rx="3" fill="#c9952a"/></g>
    <!-- the globe -->
    <rect x="110" y="236" width="30" height="14" fill="#4e2a12"/>
    <circle cx="125" cy="196" r="40" fill="url(#clGlobe)"/>
    <path d="M100 184 q12-10 22 0 q8 12 -6 18 q-10 2 -16 -18z M132 168 q14 2 18 14 q-10 6 -18 -14z M128 210 q10 -4 14 8 q-8 8 -14 -8z" fill="#7cc06a"/>
    <path d="M85 196 a40 40 0 0 0 80 0" fill="none" stroke="#c9952a" stroke-width="4"/>
    <path id="cl-globe-seam" d="M86 196 h78" stroke="#1a3a5a" stroke-width="2" stroke-dasharray="4 3" style="display:none"/>
  </g>

  <!-- the teacher's desk with the register -->
  <g id="cl-desk">
    <rect x="200" y="480" width="360" height="30" rx="5" fill="#9c6a35" stroke="#4e2a12" stroke-width="4"/>
    <rect x="216" y="508" width="140" height="150" fill="#8a5a2b" stroke="#4e2a12" stroke-width="4"/>
    <rect x="228" y="524" width="116" height="40" rx="3" fill="#9c6a35" stroke="#4e2a12" stroke-width="3"/>
    <circle cx="286" cy="544" r="5" fill="#f2c94c"/>
    <rect x="530" y="508" width="16" height="150" fill="#8a5a2b"/>
    <g id="cl-register"><rect x="240" y="460" width="96" height="22" rx="2" fill="#c4302b"/><rect x="244" y="456" width="88" height="6" fill="#fffaf0"/></g>
    <g><rect x="390" y="452" width="34" height="30" rx="4" fill="#e8571f"/><circle cx="398" cy="448" r="6" fill="#c4302b"/><circle cx="414" cy="446" r="6" fill="#7cc06a"/></g>
    <rect x="460" y="440" width="18" height="42" rx="3" fill="#2f5f9a"/><rect x="482" y="448" width="16" height="34" rx="3" fill="#f2c94c"/>
  </g>

  <!-- Pippi's enormous cake on the side table -->
  <g id="cl-cake">
    <rect x="1040" y="540" width="240" height="20" rx="4" fill="#9c6a35"/>
    <rect x="1056" y="558" width="14" height="100" fill="#8a5a2b"/><rect x="1250" y="558" width="14" height="100" fill="#8a5a2b"/>
    <ellipse cx="1160" cy="536" rx="104" ry="18" fill="#f3efe3"/>
    <g id="cl-cakewhole"><path d="M1076 450 h168 v80 q-84 18 -168 0z" fill="#f2a7b8"/><ellipse cx="1160" cy="450" rx="84" ry="16" fill="#fff4f7"/>
      <path d="M1076 480 q42 10 84 0 q42 -10 84 0" stroke="#fff4f7" stroke-width="8" fill="none"/>
      <g fill="#c4302b"><circle cx="1120" cy="444" r="7"/><circle cx="1160" cy="440" r="7"/><circle cx="1200" cy="446" r="7"/></g>
      <text x="1160" y="512" text-anchor="middle" font-family="Caveat, cursive" font-size="20" fill="#7a1e14">P.</text></g>
    <g id="cl-cakecut" style="display:none"><path d="M1076 470 h70 v60 q-35 6 -70 -4z M1170 470 h74 v56 q-37 10 -74 4z" fill="#f2a7b8"/><path d="M1120 500 h18 v26 h-18z" fill="#e88aa0"/></g>
  </g>

  <!-- the pupils' desks, with Pippi sitting on hers, feet up -->
  <g id="cl-pupils">
    <rect x="620" y="610" width="180" height="22" rx="4" fill="#c98a4b" stroke="#7a4a1f" stroke-width="3"/>
    <rect x="830" y="610" width="180" height="22" rx="4" fill="#c98a4b" stroke="#7a4a1f" stroke-width="3"/>
    <g fill="#9c6233"><rect x="636" y="630" width="12" height="90"/><rect x="772" y="630" width="12" height="90"/><rect x="846" y="630" width="12" height="90"/><rect x="982" y="630" width="12" height="90"/></g>
    <!-- Pippi -->
    <g id="cl-pippi">
      <path d="M890 610 l-10 -40 h40 l-6 40z" fill="#3f8a4a"/>
      <path d="M884 576 h48 l4 -48 h-56z" fill="#3f8a4a"/>
      <path d="M900 528 v-6 h16 v6z" fill="#f3c9a4"/>
      <circle cx="908" cy="508" r="20" fill="#f3c9a4"/>
      <path d="M888 504 q2 -24 20 -24 q18 0 20 24 q-8 -10 -20 -10 q-12 0 -20 10z" fill="#e8571f"/>
      <path d="M890 506 l-26 -12 M926 506 l26 -12" stroke="#e8571f" stroke-width="7" stroke-linecap="round"/>
      <circle cx="901" cy="510" r="2.4" fill="#1a120c"/><circle cx="915" cy="510" r="2.4" fill="#1a120c"/>
      <path d="M900 518 q8 7 16 0" stroke="#9a3a2a" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <g class="swing"><path d="M886 608 l-40 30" stroke="#6b4423" stroke-width="12" stroke-linecap="round"/><ellipse cx="838" cy="646" rx="20" ry="9" fill="#1a1a1a"/></g>
      <g class="swing b"><path d="M926 608 l40 30" stroke="#1a1a1a" stroke-width="12" stroke-linecap="round"/><ellipse cx="976" cy="646" rx="20" ry="9" fill="#1a1a1a"/></g>
    </g>
  </g>

  <!-- the door, with the teacher looking in -->
  <g id="cl-door">
    <rect x="1370" y="180" width="190" height="480" rx="6" fill="#4e2a12"/>
    <rect x="1384" y="194" width="162" height="466" rx="4" fill="#2f5f9a" stroke="#183a66" stroke-width="5"/>
    <rect x="1410" y="216" width="110" height="120" rx="4" fill="#cdeaff" stroke="#183a66" stroke-width="5"/>
    <g id="cl-teacher"><circle cx="1465" cy="290" r="26" fill="#f0c8a0"/><path d="M1437 286 q0 -36 28 -36 q28 0 28 36 q-6 -18 -28 -18 q-22 0 -28 18z" fill="#8a5a3a"/><circle cx="1465" cy="248" r="12" fill="#8a5a3a"/>
      <circle cx="1456" cy="292" r="7" fill="none" stroke="#3a2a1a" stroke-width="2"/><circle cx="1474" cy="292" r="7" fill="none" stroke="#3a2a1a" stroke-width="2"/><path d="M1458 308 q7 5 14 0" stroke="#9a3a2a" stroke-width="2.4" fill="none"/>
      <path d="M1430 336 q4 -18 35 -20 q31 2 35 20z" fill="#c4302b"/></g>
    <circle cx="1400" cy="440" r="11" fill="#c9952a"/>
    <rect x="1394" y="458" width="12" height="22" rx="3" fill="#2a1a0c"/>
    <circle id="cl-doorled" cx="1400" cy="468" r="3" fill="#e2483d"/>
    <text x="1465" y="400" text-anchor="middle" font-family="Fredoka, sans-serif" font-size="16" font-weight="700" fill="#fffaf0">CLASS 3</text>
  </g>

  <!-- the jam jar with the spunk, on the windowless sill of the board -->
  <g id="cl-spunk"><rect x="910" y="352" width="30" height="30" rx="5" fill="#cfe6e0" opacity=".6" stroke="#e9f4f0" stroke-width="2"/><rect x="908" y="346" width="34" height="7" rx="3" fill="#e8571f"/><ellipse class="crawl" cx="925" cy="372" rx="6" ry="4" fill="#2f8a3a"/></g>

  <rect width="1600" height="900" fill="url(#clSun)" pointer-events="none"/>
  <rect width="1600" height="900" fill="url(#clVign)" pointer-events="none"/>

  <!-- hotspots -->
  <g>
    <rect class="hit" fill="transparent" data-hs="board3" data-label="Blackboard" x="430" y="110" width="470" height="280"/>
    <rect class="hit" fill="transparent" data-hs="spunk3" data-label="Jam jar" x="900" y="340" width="50" height="48" id="hit-spunk3"/>
    <rect class="hit" fill="transparent" data-hs="nine" data-label="9-times poster" x="246" y="126" width="148" height="188"/>
    <rect class="hit" fill="transparent" data-hs="clock3" data-label="Clock" x="676" y="38" width="68" height="68"/>
    <rect class="hit" fill="transparent" data-hs="plan" data-label="Plan of the classroom" x="1026" y="126" width="198" height="158"/>
    <rect class="hit" fill="transparent" data-hs="globe" data-label="Globe" x="80" y="150" width="90" height="100"/>
    <rect class="hit" fill="transparent" data-hs="cupboard" data-label="Nature cupboard" x="40" y="250" width="170" height="410"/>
    <rect class="hit" fill="transparent" data-hs="register" data-label="Register" x="236" y="448" width="104" height="38"/>
    <rect class="hit" fill="transparent" data-hs="tdesk" data-label="Teacher's desk" x="200" y="486" width="360" height="172"/>
    <rect class="hit" fill="transparent" data-hs="cake" data-label="Pippi's cake" x="1060" y="420" width="200" height="130"/>
    <rect class="hit" fill="transparent" data-hs="pippi3" data-label="Pippi" x="830" y="470" width="150" height="190"/>
    <rect class="hit" fill="transparent" data-hs="teacher" data-label="The teacher" x="1406" y="212" width="118" height="128"/>
    <rect class="hit" fill="transparent" data-hs="cdoor" data-label="Classroom door" x="1370" y="340" width="190" height="320"/>
  </g>
</svg>
