<svg xmlns="http://www.w3.org/2000/svg" class="scene on" id="sc-kitchen" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-label="The kitchen of Villa Villekulla">
  <defs>
    <linearGradient id="vkWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3f7468"/><stop offset="1" stop-color="#2c564d"/></linearGradient>
    <pattern id="vkPlank" width="80" height="640" patternUnits="userSpaceOnUse"><path d="M0 0V640" stroke="rgba(0,0,0,.18)" stroke-width="3"/><circle cx="40" cy="120" r="4" fill="#f2c94c" opacity=".35"/><circle cx="40" cy="330" r="4" fill="#e8571f" opacity=".35"/><circle cx="40" cy="540" r="4" fill="#f2c94c" opacity=".35"/></pattern>
    <linearGradient id="vkFloor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a4a26"/><stop offset="1" stop-color="#3e2412"/></linearGradient>
    <linearGradient id="vkSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f2a5c"/><stop offset=".65" stop-color="#e0855a"/><stop offset="1" stop-color="#f6c36b"/></linearGradient>
    <radialGradient id="vkLamp" cx=".5" cy=".1" r=".9"><stop offset="0" stop-color="#ffd58a" stop-opacity=".35"/><stop offset="1" stop-color="#ffd58a" stop-opacity="0"/></radialGradient>
    <radialGradient id="vkFireG" cx=".5" cy=".6" r=".6"><stop offset="0" stop-color="#ffd25a"/><stop offset=".5" stop-color="#ff7a2e"/><stop offset="1" stop-color="#b3260f"/></radialGradient>
    <radialGradient id="vkGlow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ff9a3c" stop-opacity=".45"/><stop offset="1" stop-color="#ff9a3c" stop-opacity="0"/></radialGradient>
    <linearGradient id="vkGold" x1="0" x2="1"><stop offset="0" stop-color="#c9952a"/><stop offset=".5" stop-color="#f3d27a"/><stop offset="1" stop-color="#b07f1f"/></linearGradient>
    <radialGradient id="vkMirror" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#d9eef0"/><stop offset="1" stop-color="#7fa3a8"/></radialGradient>
    <radialGradient id="vkVign" cx=".5" cy=".45" r=".75"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".6"/></radialGradient>
  </defs>

  <!-- wall, ceiling beam, lamp light -->
  <rect width="1600" height="650" fill="url(#vkWall)"/>
  <rect width="1600" height="650" fill="url(#vkPlank)"/>
  <rect width="1600" height="36" fill="#4a2c16"/>
  <rect y="36" width="1600" height="8" fill="#2e1a0c"/>
  <rect y="600" width="1600" height="50" fill="#22443c"/>

  <!-- signal flags on a string across the ceiling (drawn by buildKitchen in js/chapter1.js) -->
  <path d="M90 60 Q800 130 1510 60" stroke="#e9dcc0" stroke-width="3" fill="none"/>
  <g id="vk-flags"></g>

  <!-- the stove -->
  <g id="vk-stove">
    <rect x="150" y="44" width="34" height="320" fill="#26201c"/>
    <rect x="144" y="150" width="46" height="12" rx="3" fill="#3b322c"/>
    <rect x="60" y="360" width="250" height="40" rx="6" fill="#2f2925"/>
    <rect x="70" y="352" width="230" height="14" rx="4" fill="#4a423c"/>
    <ellipse cx="125" cy="356" rx="36" ry="6" fill="#1b1714"/>
    <ellipse cx="240" cy="356" rx="36" ry="6" fill="#1b1714"/>
    <g id="vk-pan"><ellipse cx="240" cy="346" rx="44" ry="10" fill="#151210"/><rect x="282" y="340" width="56" height="8" rx="4" fill="#151210"/></g>
    <rect x="66" y="400" width="238" height="250" rx="6" fill="#221d1a"/>
    <rect x="86" y="420" width="96" height="86" rx="6" fill="#120f0d" stroke="#5a504a" stroke-width="4"/>
    <g id="vk-fire" style="display:none">
      <ellipse cx="134" cy="470" rx="80" ry="70" fill="url(#vkGlow)"/>
      <rect x="92" y="426" width="84" height="74" rx="4" fill="url(#vkFireG)" opacity=".85"/>
      <path class="flame" d="M104 498 q6-40 18-46 q-2 20 10 26 q4-30 18-40 q4 30 14 34 q6 10 2 26z" fill="#ffd25a"/>
      <path class="flame b" d="M114 498 q8-24 16-26 q2 14 10 14 q4-16 12-20 q4 20 6 32z" fill="#fff1b8"/>
    </g>
    <g fill="#3a332e" stroke="#5a504a" stroke-width="2"><rect x="96" y="512" width="76" height="10" rx="3"/></g>
    <rect x="196" y="420" width="96" height="190" rx="6" fill="#2a2420" stroke="#5a504a" stroke-width="4"/>
    <rect x="270" y="500" width="10" height="36" rx="4" fill="#8a7a6a"/>
    <!-- the enamel sign about fire -->
    <rect x="200" y="200" width="104" height="70" rx="6" fill="#f3efe3" stroke="#1f4d8c" stroke-width="5"/>
    <path d="M252 214 l22 38 h-44z" fill="none" stroke="#e8571f" stroke-width="5" stroke-linejoin="round"/>
    <text x="252" y="263" text-anchor="middle" font-family="Fredoka, sans-serif" font-size="9" font-weight="700" fill="#1f4d8c">FIRE</text>
    <!-- the wood basket -->
    <path d="M14 590 h56 l-8 60 h-40z" fill="#8a5a2b" stroke="#5a3a1a" stroke-width="3"/>
    <g fill="#a8743d" stroke="#5a3a1a" stroke-width="2"><rect x="16" y="572" width="54" height="14" rx="7" transform="rotate(-8 43 579)"/><rect x="18" y="562" width="50" height="13" rx="6" transform="rotate(6 43 568)"/></g>
  </g>

  <!-- the pantry cupboard -->
  <g id="vk-pantry">
    <rect x="334" y="214" width="140" height="436" rx="6" fill="#2f5f9a" stroke="#183a66" stroke-width="5"/>
    <rect x="348" y="232" width="52" height="190" rx="4" fill="#3a70b0" stroke="#183a66" stroke-width="3"/>
    <rect x="408" y="232" width="52" height="190" rx="4" fill="#3a70b0" stroke="#183a66" stroke-width="3"/>
    <rect x="348" y="440" width="112" height="196" rx="4" fill="#3a70b0" stroke="#183a66" stroke-width="3"/>
    <path d="M374 282 q0-18 0 0 M434 282" stroke="#f2c94c" stroke-width="4"/>
    <g fill="#f2c94c"><circle cx="394" cy="330" r="6"/><circle cx="414" cy="330" r="6"/><circle cx="404" cy="530" r="6"/></g>
    <g fill="none" stroke="#f2c94c" stroke-width="3" opacity=".8"><path d="M362 256 q12 14 24 0 q-12-14-24 0z"/><path d="M422 256 q12 14 24 0 q-12-14-24 0z"/><path d="M380 470 q24 20 48 0"/></g>
  </g>

  <!-- the window: the garden at sunset, the old oak, the road -->
  <g id="vk-window">
    <rect x="504" y="140" width="272" height="290" rx="8" fill="#f3efe3"/>
    <rect x="520" y="156" width="240" height="258" fill="url(#vkSky)"/>
    <circle cx="700" cy="206" r="16" fill="#fff4d0" opacity=".9"/>
    <path d="M520 340 q60-26 120-8 q60 16 120-10 v92 h-240z" fill="#2c4a2a"/>
    <path d="M520 382 h240 v32 h-240z" fill="#b48a52" opacity=".6"/>
    <g fill="#1d3220"><rect x="566" y="250" width="16" height="110"/><circle cx="574" cy="246" r="44"/><circle cx="548" cy="270" r="28"/><circle cx="604" cy="268" r="30"/></g>
    <rect x="636" y="156" width="8" height="258" fill="#f3efe3"/>
    <rect x="520" y="282" width="240" height="8" fill="#f3efe3"/>
    <path d="M496 140 q40 60 10 290 h-10z M784 140 q-40 60-10 290 h10z" fill="#e8571f" opacity=".9"/>
    <g fill="#f2c94c" opacity=".9"><circle cx="502" cy="190" r="4"/><circle cx="504" cy="260" r="4"/><circle cx="502" cy="340" r="4"/><circle cx="778" cy="190" r="4"/><circle cx="776" cy="260" r="4"/><circle cx="778" cy="340" r="4"/></g>
    <rect x="490" y="428" width="300" height="16" rx="4" fill="#d9cdb0"/>
  </g>
  <!-- the spunk in a jam jar on the windowsill -->
  <g id="vk-spunk">
    <rect x="726" y="392" width="38" height="38" rx="6" fill="#cfe6e0" opacity=".55" stroke="#e9f4f0" stroke-width="2"/>
    <rect x="724" y="386" width="42" height="8" rx="3" fill="#e8571f"/>
    <ellipse cx="745" cy="416" rx="8" ry="6" fill="#2f8a3a"/><circle cx="745" cy="409" r="3.5" fill="#1d5a25"/>
    <path d="M738 416h-6M752 416h6M739 421l-5 4M751 421l5 4" stroke="#1d5a25" stroke-width="1.6"/>
  </g>

  <!-- the mirror -->
  <g id="vk-mirror">
    <ellipse cx="846" cy="268" rx="50" ry="70" fill="url(#vkGold)"/>
    <ellipse cx="846" cy="268" rx="40" ry="60" fill="url(#vkMirror)"/>
    <path d="M820 236 q8-16 22-20" stroke="#fff" stroke-width="4" fill="none" opacity=".7" stroke-linecap="round"/>
    <circle cx="846" cy="196" r="7" fill="url(#vkGold)"/>
  </g>

  <!-- Captain Longstocking's signal-flag chart -->
  <g id="vk-chart">
    <rect x="918" y="186" width="110" height="150" fill="#f3e6c4" stroke="#7a5a2a" stroke-width="4" transform="rotate(2 973 261)"/>
    <g transform="rotate(2 973 261)">
      <text x="973" y="206" text-anchor="middle" font-family="Fredoka, sans-serif" font-size="11" font-weight="700" fill="#1f4d8c">FLAGS A–Z</text>
      <g id="vk-chartgrid"></g>
    </g>
    <circle cx="973" cy="190" r="4" fill="#c33"/>
  </g>

  <!-- floor and rug -->
  <rect y="650" width="1600" height="250" fill="url(#vkFloor)"/>
  <g stroke="rgba(0,0,0,.25)" stroke-width="3"><path d="M0 700H1600M0 760H1600M0 830H1600"/></g>
  <ellipse cx="760" cy="800" rx="380" ry="62" fill="#b5342a"/>
  <ellipse cx="760" cy="800" rx="340" ry="48" fill="none" stroke="#f2c94c" stroke-width="6" stroke-dasharray="18 12"/>

  <!-- the bureau with lots of little drawers, and the gold suitcase on top -->
  <g id="vk-bureau">
    <rect x="1050" y="364" width="230" height="286" rx="6" fill="#8a4b22" stroke="#4e2a12" stroke-width="5"/>
    <rect x="1040" y="352" width="250" height="18" rx="4" fill="#9c5a2c"/>
    <g id="vk-drawers"></g>
    <g id="vk-lock"><rect x="1150" y="586" width="30" height="26" rx="4" fill="#c9952a" stroke="#7a5a1a" stroke-width="2"/><path d="M1156 586 v-10 a9 9 0 0 1 18 0 v10" fill="none" stroke="#9aa0a6" stroke-width="4"/></g>
    <!-- the suitcase full of gold coins -->
    <rect x="1064" y="300" width="104" height="54" rx="6" fill="#6b3a1a" stroke="#3e200c" stroke-width="3"/>
    <path d="M1100 300 v-10 h32 v10" fill="none" stroke="#3e200c" stroke-width="5"/>
    <g fill="url(#vkGold)"><circle cx="1084" cy="326" r="6"/><circle cx="1146" cy="326" r="6"/></g>
  </g>

  <!-- Mr Nilsson on top of the bureau, holding the key -->
  <g id="vk-nilsson">
    <path d="M1250 340 q40 0 34-40 q-4-22 14-30" stroke="#6b4423" stroke-width="7" fill="none" stroke-linecap="round"/>
    <ellipse cx="1226" cy="320" rx="24" ry="30" fill="#2f5f9a"/>
    <rect x="1206" y="296" width="40" height="22" rx="8" fill="#f2c94c"/>
    <circle cx="1226" cy="270" r="22" fill="#6b4423"/>
    <ellipse cx="1226" cy="276" rx="14" ry="12" fill="#e6c49a"/>
    <circle cx="1204" cy="266" r="8" fill="#6b4423"/><circle cx="1248" cy="266" r="8" fill="#6b4423"/>
    <circle cx="1220" cy="272" r="2.6" fill="#1a120c"/><circle cx="1232" cy="272" r="2.6" fill="#1a120c"/>
    <path d="M1220 282 q6 5 12 0" stroke="#5a3a1a" stroke-width="2" fill="none"/>
    <ellipse cx="1226" cy="250" rx="30" ry="6" fill="#e9d48a"/><path d="M1212 250 q14-26 28 0z" fill="#e9d48a"/><rect x="1212" y="244" width="28" height="5" fill="#c33"/>
    <g id="vk-nkey"><circle cx="1266" cy="306" r="8" fill="none" stroke="#c9952a" stroke-width="4"/><path d="M1266 314 v22 m0-8 h7 m-7 6 h6" stroke="#c9952a" stroke-width="4"/></g>
    <path d="M1246 306 q14-4 18 0" stroke="#6b4423" stroke-width="7" stroke-linecap="round" fill="none"/>
  </g>

  <!-- the front door, the horse looking in through its window -->
  <g id="vk-door">
    <rect x="1316" y="180" width="200" height="470" rx="6" fill="#4e2a12"/>
    <rect x="1330" y="194" width="172" height="456" rx="4" fill="#3f8a4a" stroke="#265a2e" stroke-width="5"/>
    <rect x="1356" y="214" width="120" height="110" rx="6" fill="#f3d79a" stroke="#265a2e" stroke-width="5"/>
    <g id="vk-horse">
      <path d="M1376 324 q-6-60 30-82 l4-14 l8 12 q30 2 40 40 q8 26 2 44z" fill="#f5f2ea"/>
      <g fill="#1a1a1a"><circle cx="1400" cy="290" r="6"/><circle cx="1428" cy="270" r="5"/><circle cx="1442" cy="304" r="7"/><circle cx="1394" cy="312" r="4"/></g>
      <circle cx="1418" cy="262" r="3" fill="#1a1a1a"/>
      <ellipse cx="1452" cy="306" rx="8" ry="12" fill="#e6d6c6"/>
      <path d="M1406 242 q-14 0-20 20" stroke="#d9c79a" stroke-width="6" fill="none"/>
    </g>
    <rect x="1356" y="350" width="120" height="110" rx="4" fill="none" stroke="#265a2e" stroke-width="5"/>
    <rect x="1356" y="480" width="120" height="140" rx="4" fill="none" stroke="#265a2e" stroke-width="5"/>
    <circle cx="1350" cy="430" r="11" fill="url(#vkGold)"/>
    <rect x="1344" y="448" width="12" height="22" rx="3" fill="#2a1a0c"/>
    <circle id="vk-doorled" cx="1350" cy="458" r="3" fill="#e2483d"/>
    <g fill="#e8571f"><circle cx="1416" cy="404" r="16"/><circle cx="1416" cy="404" r="6" fill="#f2c94c"/></g>
  </g>

  <!-- the table, with Pippi's note, the homework and a mixing bowl -->
  <g id="vk-table">
    <rect x="470" y="600" width="470" height="28" rx="6" fill="#c98a4b" stroke="#7a4a1f" stroke-width="4"/>
    <g fill="#9c6233"><rect x="494" y="626" width="18" height="190"/><rect x="900" y="626" width="18" height="190"/><rect x="560" y="626" width="14" height="150"/><rect x="842" y="626" width="14" height="150"/></g>
    <g id="vk-note"><rect x="512" y="572" width="78" height="54" fill="#fffaf0" transform="rotate(-7 551 599)"/><g stroke="#e8571f" stroke-width="2" transform="rotate(-7 551 599)"><path d="M520 586h60M520 596h52M520 606h58M520 616h30"/></g></g>
    <g id="vk-hw"><rect x="624" y="566" width="96" height="40" rx="2" fill="#2f5f9a" transform="rotate(4 672 586)"/><rect x="632" y="572" width="80" height="28" fill="#f3efe3" transform="rotate(4 672 586)"/><text x="672" y="592" text-anchor="middle" font-family="Caveat, cursive" font-size="16" fill="#1f4d8c" transform="rotate(4 672 586)">2×3=4</text></g>
    <g id="vk-bowl"><path d="M770 560 h120 q-6 44-60 44 q-54 0-60-44z" fill="#e9dcc0" stroke="#b5a580" stroke-width="3"/><path d="M780 566 h100" stroke="#e8571f" stroke-width="4"/><path d="M856 554 l34-40" stroke="#9aa0a6" stroke-width="4"/></g>
  </g>

  <!-- Captain Longstocking's sea chest -->
  <g id="vk-chest">
    <rect x="1080" y="712" width="210" height="110" rx="8" fill="#6b3a1a" stroke="#3e200c" stroke-width="5"/>
    <path d="M1080 740 q105-40 210 0" fill="#7d4621" stroke="#3e200c" stroke-width="5"/>
    <g fill="#9aa0a6"><rect x="1110" y="712" width="12" height="110"/><rect x="1248" y="712" width="12" height="110"/></g>
    <rect id="vk-chestlock" x="1158" y="740" width="54" height="34" rx="4" fill="#c9952a" stroke="#7a5a1a" stroke-width="3"/>
    <g fill="#3e200c"><rect x="1164" y="748" width="7" height="18"/><rect x="1174" y="748" width="7" height="18"/><rect x="1184" y="748" width="7" height="18"/><rect x="1194" y="748" width="7" height="18"/><rect x="1204" y="748" width="5" height="18"/></g>
    <text x="1185" y="805" text-anchor="middle" font-family="Fredoka, sans-serif" font-size="14" font-weight="700" fill="#e9d48a">E. L.</text>
    <g id="vk-sugar" style="display:none"><rect x="1240" y="694" width="20" height="20" fill="#fff"/><rect x="1262" y="698" width="18" height="18" fill="#f3efe3"/></g>
  </g>

  <rect width="1600" height="900" fill="url(#vkLamp)" pointer-events="none"/>
  <rect width="1600" height="900" fill="url(#vkVign)" pointer-events="none"/>

  <!-- hotspots -->
  <g>
    <rect class="hit" fill="transparent" data-hs="flags" data-label="Flags on a string" x="420" y="56" width="780" height="110"/>
    <rect class="hit" fill="transparent" data-hs="stove" data-label="Stove" x="60" y="340" width="250" height="310"/>
    <rect class="hit" fill="transparent" data-hs="sign" data-label="Enamel sign" x="196" y="196" width="112" height="78"/>
    <rect class="hit" fill="transparent" data-hs="wood" data-label="Wood basket" x="10" y="556" width="66" height="96"/>
    <rect class="hit" fill="transparent" data-hs="pantry" data-label="Pantry cupboard" x="334" y="214" width="140" height="436"/>
    <rect class="hit" fill="transparent" data-hs="window" data-label="Window" x="504" y="140" width="210" height="290"/>
    <rect class="hit" fill="transparent" data-hs="spunk" data-label="Jam jar" x="718" y="380" width="56" height="54" id="hit-spunk"/>
    <rect class="hit" fill="transparent" data-hs="mirror" data-label="Mirror" x="794" y="190" width="104" height="150"/>
    <rect class="hit" fill="transparent" data-hs="chart" data-label="Flag chart" x="914" y="184" width="118" height="158"/>
    <rect class="hit" fill="transparent" data-hs="nilsson" data-label="Mr Nilsson" x="1180" y="236" width="104" height="122"/>
    <rect class="hit" fill="transparent" data-hs="suitcase" data-label="Suitcase" x="1060" y="286" width="112" height="70"/>
    <rect class="hit" fill="transparent" data-hs="bureau" data-label="Bureau" x="1040" y="362" width="250" height="290"/>
    <rect class="hit" fill="transparent" data-hs="horse" data-label="The horse" x="1352" y="210" width="128" height="118"/>
    <rect class="hit" fill="transparent" data-hs="door" data-label="Front door" x="1316" y="330" width="200" height="320"/>
    <rect class="hit" fill="transparent" data-hs="note" data-label="Note" x="506" y="562" width="94" height="68" id="hit-note"/>
    <rect class="hit" fill="transparent" data-hs="homework" data-label="Exercise book" x="620" y="556" width="106" height="56"/>
    <rect class="hit" fill="transparent" data-hs="bowl" data-label="Mixing bowl" x="764" y="510" width="132" height="98"/>
    <rect class="hit" fill="transparent" data-hs="chest" data-label="Sea chest" x="1076" y="690" width="218" height="136"/>
  </g>
</svg>
